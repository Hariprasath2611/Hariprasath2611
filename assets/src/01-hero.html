<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 900px;
      background-color: #1B1030;
      padding: 44px 48px 24px 48px;
      font-family: 'DM Sans', sans-serif;
      color: #F6F1FF;
      overflow: hidden;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 36px;
      font-family: 'Space Mono', monospace;
      font-size: 13.5px;
      font-weight: 700;
      color: #B79CFF;
      letter-spacing: 0.5px;
    }
    .hero-row {
      display: flex;
      align-items: flex-start;
      gap: 36px;
    }
    .photo-card {
      width: 256px;
      flex-shrink: 0;
      background-color: #FF8A3D;
      border-radius: 28px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .photo-container {
      width: 100%;
      height: 290px;
      overflow: hidden;
      background-color: #1B1030;
    }
    .photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 48% 22%;
      display: block;
    }
    .photo-label {
      padding: 16px 20px 20px 20px;
      background-color: #FF8A3D;
    }
    .photo-label h3 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 24px;
      line-height: 1.1;
      color: #1B1030;
      letter-spacing: -0.5px;
    }
    .hero-content {
      flex: 1;
      padding-top: 12px;
      display: flex;
      flex-direction: column;
    }
    .hero-name {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 78px;
      line-height: 0.95;
      letter-spacing: -3px;
      color: #F6F1FF;
      margin-bottom: 32px;
    }
    .hero-bio {
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      font-size: 19px;
      line-height: 1.48;
      color: #CFC4EA;
      margin-bottom: 44px;
      max-width: 480px;
    }
    .hero-status {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      font-weight: 400;
      color: #F6F1FF;
    }
    .status-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background-color: #FF8A3D;
      box-shadow: 0 0 10px rgba(255, 138, 61, 0.7);
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <span>PLAYER 01</span>
    <span>@HARIPRASATH2611</span>
  </div>

  <div class="hero-row">
    <div class="photo-card">
      <div class="photo-container">
        <img src="../profile.png" alt="Hariprasath">
      </div>
      <div class="photo-label">
        <h3>Full stack<br>developer</h3>
      </div>
    </div>

    <div class="hero-content">
      <h1 class="hero-name">Hariprasath</h1>
      <p class="hero-bio">
        I build web and mobile apps end to end, from the database to the screen. Clean APIs, fast interfaces, and data models that hold up.
      </p>
      <div class="hero-status">
        <span class="status-dot"></span>
        <span>Open to new projects</span>
      </div>
    </div>
  </div>
</body>
</html>
