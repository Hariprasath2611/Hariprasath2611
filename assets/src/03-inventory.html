<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 900px;
      background-color: #1B1030;
      padding: 12px 48px;
      overflow: hidden;
      font-family: 'Space Mono', monospace;
    }
    .inventory-card {
      background-color: #2A1A4A;
      border-radius: 24px;
      padding: 36px 40px;
    }
    .inventory-title {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 32px;
      line-height: 1;
      color: #F6F1FF;
      margin-bottom: 32px;
    }
    .skill-rows {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .skill-row {
      display: flex;
      align-items: center;
    }
    .skill-label {
      width: 120px;
      flex-shrink: 0;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      color: #B79CFF;
      letter-spacing: 0.5px;
    }
    .skill-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .chip {
      background-color: #1B1030;
      border-radius: 8px;
      padding: 9px 18px;
      font-family: 'Space Mono', monospace;
      font-size: 13.5px;
      font-weight: 700;
      color: #F6F1FF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .chip.highlight {
      background-color: #FF8A3D;
      color: #1B1030;
    }
  </style>
</head>
<body>
  <div class="inventory-card">
    <h2 class="inventory-title">Inventory</h2>
    <div class="skill-rows">
      <div class="skill-row">
        <span class="skill-label">FRONTEND</span>
        <div class="skill-chips">
          <span class="chip">HTML</span>
          <span class="chip">CSS</span>
          <span class="chip">JavaScript</span>
          <span class="chip">React</span>
        </div>
      </div>
      <div class="skill-row">
        <span class="skill-label">MOBILE</span>
        <div class="skill-chips">
          <span class="chip">React Native</span>
          <span class="chip">Flutter</span>
        </div>
      </div>
      <div class="skill-row">
        <span class="skill-label">BACKEND</span>
        <div class="skill-chips">
          <span class="chip">Node.js</span>
          <span class="chip">Express.js</span>
        </div>
      </div>
      <div class="skill-row">
        <span class="skill-label">DATABASE</span>
        <div class="skill-chips">
          <span class="chip">MongoDB</span>
          <span class="chip">PostgreSQL</span>
          <span class="chip highlight">Vector DBs</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
