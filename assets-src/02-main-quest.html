<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 900px;
      background-color: #1B1030;
      padding: 10px 48px;
      overflow: hidden;
      font-family: 'DM Sans', sans-serif;
    }
    .quest-card {
      background-color: #2A1A4A;
      border-radius: 24px;
      padding: 20px 28px;
      display: flex;
      align-items: center;
      gap: 22px;
    }
    .quest-badge {
      background-color: #B79CFF;
      border-radius: 12px;
      padding: 11px 22px;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 17px;
      line-height: 1;
      color: #1B1030;
      letter-spacing: 0.3px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .quest-text {
      color: #F6F1FF;
      font-size: 15.2px;
      font-weight: 500;
      line-height: 1.4;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="quest-card">
    <div class="quest-badge">MAIN QUEST</div>
    <div class="quest-text">Learning vector databases, and how semantic search is built on top of them.</div>
  </div>
</body>
</html>
