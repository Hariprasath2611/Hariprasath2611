<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 900px;
      background-color: #1B1030;
      padding: 10px 48px 40px 48px;
      overflow: hidden;
      font-family: 'Space Mono', monospace;
    }
    .footer-card {
      background-color: #B79CFF;
      border-radius: 24px;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-title {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 26px;
      line-height: 1;
      color: #1B1030;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }
    .footer-pills {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pill {
      border-radius: 999px;
      padding: 8px 13px;
      font-family: 'Space Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: -0.3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      text-decoration: none;
    }
    .pill-dark {
      background-color: #1B1030;
      color: #F6F1FF;
    }
    .pill-outlined {
      background-color: transparent;
      border: 1.2px solid #1B1030;
      color: #1B1030;
    }
  </style>
</head>
<body>
  <div class="footer-card">
    <h2 class="footer-title">Join my party</h2>
    <div class="footer-pills">
      <a class="pill pill-dark" href="https://hariprasathportfolio-zeta.vercel.app/" target="_blank">hariprasathportfolio-zeta.vercel.app</a>
      <a class="pill pill-outlined" href="mailto:hariprasathd26112006@gmail.com">[hariprasathd26112006@gmail.com]</a>
    </div>
  </div>
</body>
</html>
